name: 不具合報告
description: おかしな動き・エラーを報告する
title: "[不具合] "
labels: ["不具合"]
body:
  - type: textarea
    id: what
    attributes:
      label: 何が起きたか
      description: 画面に出た文言はそのまま貼り付けてください
    validations:
      required: true
  - type: input
    id: url
    attributes:
      label: 配信アーカイブのURL（分かれば）
  - type: textarea
    id: steps
    attributes:
      label: 再現手順（分かれば）
